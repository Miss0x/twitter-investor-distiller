<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>治理卡片预览</title>
<style>
:root {
  --text-primary: #f0f6fc;
  --text-secondary: #8b949e;
  --text-tertiary: #6e7681;
  --text-success: #3fb950;
  --text-warning: #d29922;
  --text-danger: #f85149;
  --text-info: #58a6ff;
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --border-primary: #30363d;
  --border-secondary: #21262d;
  --border-tertiary: #373e47;
  --radius-md: 6px;
  --font-mono: 'SF Mono', Consolas, monospace;
  --text-success-rgb: 63,185,80;
  --text-danger-rgb: 248,81,73;
  --text-warning-rgb: 210,153,34;
  --shadow-card: 0 1px 3px rgba(0,0,0,.3);
}
body { background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; margin: 0; }
.card-title { font-size: 15px; font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid var(--border-primary); margin-bottom: 12px; }
.text-secondary { color: var(--text-secondary) }
.text-tertiary { color: var(--text-tertiary) }
.text-success { color: var(--text-success) }
.text-warning { color: var(--text-warning) }
.text-danger { color: var(--text-danger) }
.text-info { color: var(--text-info) }
.tag-ok { display: inline-block; padding: 2px 10px; border-radius: 12px; background: rgba(63,185,80,.15); color: var(--text-success); font-size: 12px; white-space: nowrap; }
.tag-warn { display: inline-block; padding: 2px 10px; border-radius: 12px; background: rgba(210,153,34,.15); color: var(--text-warning); font-size: 12px; }
.flex { display: flex; flex-wrap: wrap; }
.preview-card { background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: var(--radius-md); padding: 16px; margin-bottom: 20px; max-width: 540px; box-shadow: var(--shadow-card); }
</style>
</head>
<body>
<h2 style="margin-bottom:20px;">📊 治理卡片预览 — NVDA 观察信号</h2>
<div class="preview-card"><div class="card-title">信号质量检查</div></div>
<div class="preview-card" style="margin-top:16px">
<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px;">
  <div>
    <div style="font-size:14px;font-weight:600;">NVDA 观察信号</div>
<div class="preview-card" style="margin-top:16px">    <div class="text-secondary" style="font-size:12px;">当前状态：pass</div>
<div class="preview-card" style="margin-top:16px">



<div style="margin-top: 12px; font-size: 11px; color: var(--text-secondary);">
  已生成详细报告，可在数据目录中查看。
</div>
</body>
</html>
