# 主配置文件

# 浏览器抓取配置（运行时由 timing.yaml 控制等待参数）
crawler:
  download_media: true
  media_types:
    - photo
    - video
  browser_headless: true
  browser_cookies_path: data/cookies.json
  human_behavior:
    min_pause_ms: 700
    max_pause_ms: 1800
    min_scroll_px: 600
    max_scroll_px: 1400
    backtrack_probability: 0.2
    min_backtrack_px: 120
    max_backtrack_px: 420
    expand_probability: 0.15

# 数据处理配置
processing:
  remove_retweets: false
  remove_replies: false
  min_text_length: 10
  deduplicate: true

# 向量化配置
vectorization:
  chunk_size: 500
  chunk_overlap: 50
  embedding_model: "text-embedding-3-small"
  batch_size: 100

# AI 配置
ai:
  model: "gpt-4-turbo-preview"
  temperature: 0.7
  max_tokens: 2000
  top_k_results: 5
  system_prompt: |
    你是一个投资助手，基于以下几位投资者的历史观点和分析来回答问题。
    这些投资者的风格和能力你非常认可。
    
    在回答时：
    1. 综合参考这些投资者的观点和逻辑
    2. 保持客观和理性
    3. 明确指出观点来源
    4. 如果投资者之间有不同看法，要呈现多角度分析
    
    相关历史内容：
    {context}
    
    用户问题：{question}

# Telegram Bot 配置
telegram:
  welcome_message: "欢迎使用 Twitter 用户蒸馏 AI 助手！\n\n发送你的投资问题，我会基于你关注的投资者的观点来回答。"
  commands:
    - command: "start"
      description: "开始使用"
    - command: "help"
      description: "帮助信息"
    - command: "users"
      description: "查看监控的用户列表"
    - command: "stats"
      description: "查看数据统计"

# Web 界面配置
web:
  host: "0.0.0.0"
  port: 8000
  title: "Twitter 用户蒸馏 AI 助手"
  description: "基于 Twitter 投资者观点的智能助手"
