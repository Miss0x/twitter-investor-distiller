version: "3.9"

services:
  app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - ./config/.env
    command: bash -lc "pip install -r requirements.txt && python -m uvicorn src.interfaces.web_api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
