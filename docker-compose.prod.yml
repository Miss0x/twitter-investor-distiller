version: "3.9"

services:
  # ── Nginx 反向代理 ──
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/templates:/usr/share/nginx/html/templates:ro
    depends_on:
      - dashboard
    restart: unless-stopped

  # ── PostgreSQL 16 ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: twitter_distiller
      POSTGRES_USER: distiller
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 必须设置}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distiller -d twitter_distiller"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Redis 7 (缓存 + 限流 + Celery broker) ──
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── 公网 Dashboard (8000) ──
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://distiller:${DB_PASSWORD:?DB_PASSWORD 必须设置}@postgres:5432/twitter_distiller
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - ENV=${ENV:-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY 必须设置}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY 必须设置}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
    command: python -m src.interfaces.web_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── 管理后台 (8001) ──
  admin:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://distiller:${DB_PASSWORD:-change-me}@postgres:5432/twitter_distiller
      - REDIS_URL=redis://redis:6379/0
      - ENV=${ENV:-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    command: python -m src.admin.app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker (异步任务) ──
  celery_worker:
    build: .
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://distiller:${DB_PASSWORD:?DB_PASSWORD 必须设置}@postgres:5432/twitter_distiller
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY 必须设置}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY 必须设置}
    command: celery -A src.pipeline.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat (定时任务调度) ──
  celery_beat:
    build: .
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://distiller:${DB_PASSWORD:?DB_PASSWORD 必须设置}@postgres:5432/twitter_distiller
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    command: celery -A src.pipeline.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
