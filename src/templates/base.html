<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Twitter Investor Distiller</title>
<style>
  /* ═══════════════════════════════════════════════════════
     暗色主题配色 — 对齐参考网站 (api.tevxzen.dpdns.org)
     LAB 颜色空间精确转换到 HSL，保证暗色感知一致性
     ═══════════════════════════════════════════════════════ */
  :root {
    /* 基础色 — 参考网站暗色主题 LAB→HSL 精确转换 */
    --bg:               hsl(0 0% 7.3%);       /* #121212, --background */
    --card:             hsl(0 0% 11.8%);      /* #1d1d1d, --card */
    --border:           hsl(0 0% 100% / .09); /* white-9%, --border */
    --border-light:     hsl(0 0% 100% / .05); /* white-5%, 更淡分割 */
    --text:             hsl(0 0% 95.4%);      /* #f3f3f3, --foreground */
    --muted:            hsl(0 0% 69.4%);      /* #b0b0b0, --muted-foreground */
    --dim:              hsl(0 0% 45%);        /* 比 muted 更暗淡 */
    /* 语义色 */
    --accent:           hsl(219.7 100% 44.9%);/* #004de5, chart-1 蓝 */
    --accent-light:     hsla(219.7 100% 44.9% / .15);
    --success:          hsl(160.3 100% 36.8%);/* #00bb7d, chart-2 绿 */
    --warning:          hsl(35.9 100% 50%);   /* #ff9800, chart-3 橙 */
    --danger:           hsl(359.2 100% 69.7%);/* #ff6466, --destructive 红 */
    /* 辅助色 (shadcn/ui 命名对齐) */
    --primary:          hsl(0 0% 95.4%);      /* #f3f3f3, 白色主色 */
    --primary-fg:       hsl(0 0% 3.9%);       /* #0a0a0a, 白色上的深色文字 */
    --secondary:        hsl(0 0% 16.5%);      /* #292929, 次要背景 */
    --ring:             hsl(0 0% 59.6%);      /* #989898, focus ring */
    /* 图表色 */
    --chart-1:          hsl(219.7 100% 44.9%);/* #004de5 蓝 */
    --chart-2:          hsl(160.3 100% 36.8%);/* #00bb7d 绿 */
    --chart-3:          hsl(35.9 100% 50%);   /* #ff9800 橙 */
    --chart-4:          hsl(265.7 100% 65.5%);/* #9a4fff 紫 */
    --chart-5:          hsl(346.4 100% 56.9%);/* #ff2355 粉红 */
    --info:             hsl(199 100% 47.5%);  /* #00a5f2 信息蓝 */
    /* 侧边栏专用 */
    --sidebar-bg:       hsl(0 0% 2%);         /* #050505, --sidebar */
    --sidebar-fg:       hsl(0 0% 93.4%);      /* #eeeeee */
    --sidebar-accent:   hsl(0 0% 18.9%);      /* #303030 */
    --sidebar-border:   hsl(0 0% 100% / .1);
    /* 圆角 / 字体 */
    --radius-sm: 6px; --radius: 0.5rem; --radius-md: 10px; --radius-lg: 14px;
    --font: system-ui, -apple-system, sans-serif;
    --font-mono: 'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, monospace;
    --sidebar-w: 232px;

    /* ═══════════════════════════════════════════════════════
       语义化别名（兼容层）—— 修复全站 40+ 处坏引用
       此前 consensus/rotation/anomaly 等模板引用了 --text-warning
       /--border-tertiary 等不存在的变量名，导致颜色全部失效、
       页面发灰无层次。这里统一映射到上方真实颜色，一处补全、全站生效。
       ═══════════════════════════════════════════════════════ */
    --text-primary:      var(--text);       /* 主文字（白） */
    --text-secondary:    var(--muted);      /* 次要文字（灰） */
    --text-tertiary:     var(--dim);        /* 最弱文字（暗灰） */
    --text-success:      var(--success);    /* 成功/看多 绿 */
    --text-warning:      var(--warning);    /* 警告/强信号 橙 */
    --text-danger:       var(--danger);     /* 危险/看空 红 */
    --text-info:         var(--info);       /* 信息 蓝 */
    --bg-secondary:      var(--secondary);  /* 次级背景面 */
    --bg-tertiary:       hsl(0 0% 14.5%);   /* 三级背景（表头等） */
    --border-primary:    hsl(0 0% 100% / .18);
    --border-secondary:  hsl(0 0% 100% / .12);
    --border-tertiary:   var(--border);     /* 默认边框 */

    /* ── 现代科技感：发光/阴影/层次令牌（美化用） ── */
    --glow-accent:  0 0 0 1px hsla(219.7 100% 44.9% / .35), 0 4px 20px hsla(219.7 100% 44.9% / .12);
    --glow-success: 0 0 0 1px hsla(160.3 100% 36.8% / .3),  0 4px 18px hsla(160.3 100% 36.8% / .1);
    --shadow-card:  0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.45);
    --ease-out:     cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); font-size: 13px; color: var(--text); background: var(--bg); line-height: 1.6; }

  /* ── 暗色滚动条 ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: hsl(0 0% 100% / .12); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: hsl(0 0% 100% / .22); }

  /* ── 全局 Toast：底部居中，滑入/滑出动画 ── */
  #global-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    padding: 10px 24px; border-radius: var(--radius);
    background: var(--primary); color: var(--primary-fg);
    font-size: 13px; z-index: 9999; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: transform .3s var(--ease-out), opacity .25s;
    box-shadow: 0 4px 24px rgba(0,0,0,.5);
    white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  #global-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* 移动端 toast 贴在底部安全区 */
  @media (max-width: 768px) {
    #global-toast { bottom: 12px; left: 12px; right: 12px; transform: translateY(100px); max-width: none; }
    #global-toast.show { transform: translateY(0); }
  }

  /* ── Layout ── */
  .layout { display: flex; min-height: 100vh; }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
    overflow-y: auto;
  }
  .sidebar .brand {
    padding: 18px 20px 14px;
    font-size: 14px; font-weight: 600; color: var(--text);
    letter-spacing: -0.01em;
    border-bottom: 1px solid hsl(0 0% 100% / .06);
    display: flex; align-items: center; gap: 9px;
  }
  .sidebar .brand .logo-mark {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), hsl(265.7 100% 65.5%));
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff; font-weight: 700;
  }
  .sidebar .brand a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 9px; }
  .sidebar .nav { flex: 1; padding: 8px; }
  .sidebar .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; margin-bottom: 2px;
    border-radius: var(--radius-sm);
    font-size: 13px; color: var(--muted);
    cursor: pointer; transition: color .15s, background .15s;
    user-select: none; position: relative;
  }
  .sidebar .nav-item:hover { color: var(--text); background: hsl(0 0% 100% / .05); }
  .sidebar .nav-item:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); border-radius: var(--radius-sm); }
  .sidebar .nav-item.active { color: var(--text); background: hsl(0 0% 100% / .08); font-weight: 500; }
  /* 激活项左侧电光蓝强调条 */
  .sidebar .nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 16px; border-radius: 0 3px 3px 0; background: var(--accent);
    transition: height .2s var(--ease-out);
  }
  .sidebar .nav-item.active:hover::before { height: 20px; }
  .sidebar .nav-item .icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; transition: transform .15s var(--ease-out); }
  .sidebar .nav-item:hover .icon { transform: scale(1.1); }
  .sidebar .footer { padding: 12px 20px; border-top: 1px solid hsl(0 0% 100% / .06); font-size: 11px; color: var(--dim); }

  /* ── Main ── */
  .main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }

  /* ── Top bar ── */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px;
    background: var(--card); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .topbar .title { font-size: 14px; font-weight: 600; }
  .topbar .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
  .topbar .pulse.on { background: var(--success); animation: softPulse 2s infinite; }
  .topbar .pulse.off { background: var(--dim); }
  @keyframes softPulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .topbar .status-text { font-size: 12px; color: var(--muted); }
  .topbar .sep { width: 1px; height: 18px; background: var(--border); }
  .topbar .spacer { flex: 1; }

  /* ── Content ── */
  .content { padding: 24px; max-width: 1320px; }
  .tab-content { display: none; }
  /* 响应式 bento 网格：卡片自动排布，span_full 卡片占满整行 */
  .tab-content.active {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
    animation: fadeIn .3s var(--ease-out);
  }
  .tab-content.active > .card { margin-bottom: 0; }
  @media (max-width: 900px) {
    .tab-content.active { grid-template-columns: 1fr; }
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ── 网格 ── */
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* ── 卡片：现代科技感 —— 微妙边框 + 层次阴影 + hover 物理位移 ── */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px 22px; margin-bottom: 16px;
    box-shadow: var(--shadow-card);
    position: relative;
    transition: border-color .2s var(--ease-out), box-shadow .2s var(--ease-out), transform .2s var(--ease-out), opacity .2s var(--ease-out);
  }
  /* 顶部 1px 高光线，模拟物理边缘折射（克制，无霓虹） */
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    background: linear-gradient(90deg, transparent, hsl(0 0% 100% / .08) 50%, transparent);
    pointer-events: none;
  }
  @media (min-width: 641px) {
    .card:hover { border-color: var(--border-secondary); transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0,0,0,.3), 0 12px 32px -10px rgba(0,0,0,.5); }
  }
  /* 卡片内容刷新微闪：自动刷新时卡片短暂高亮 */
  .card.card-flash { animation: cardFlash .6s var(--ease-out); }
  @keyframes cardFlash { 0% { background: hsla(219.7 100% 44.9% / .06); } 100% { background: var(--card); } }
  /* 焦点态：交互卡片聚焦时显示蓝色光环 */
  .card:focus-within { border-color: hsla(219.7 100% 44.9% / .3); }
  .card-headline { border-color: hsla(35.9 100% 50% / .28); background: linear-gradient(180deg, hsla(35.9 100% 50% / .07), var(--card) 60%); }
  .card-headline:hover { border-color: hsla(35.9 100% 50% / .4); }
  .card-headline .card-title { color: var(--warning); font-size: 14px; }
  .card-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--text); letter-spacing: -.01em; display: flex; align-items: center; gap: 7px; }
  /* 卡片副标题：一句话功能说明 */
  .card-subtitle { font-size: 11px; color: var(--dim); font-weight: 400; margin: -8px 0 14px; line-height: 1.5; }
  .card-error { border-color: hsla(359.2 100% 69.7% / .25); background: hsla(359.2 100% 69.7% / .06); }

  /* ── 指标：等宽数字 + 强调底纹 ── */
  .metric { background: var(--secondary); border-radius: var(--radius); padding: 16px; border: 1px solid hsl(0 0% 100% / .04); transition: border-color .15s; }
  .metric:hover { border-color: hsl(0 0% 100% / .1); }
  .metric-label { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
  .metric-value { font-size: 24px; font-weight: 600; margin-top: 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  .metric-sub { font-size: 11px; color: var(--dim); margin-top: 2px; }

  /* ── 表格 ── */
  table.data { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { padding: 8px 12px; text-align: left; }
  table.data th { background: var(--bg-tertiary); color: var(--muted); font-weight: 500; font-size: 11px; border-bottom: 1px solid var(--border); letter-spacing: .02em; position: sticky; top: 0; }
  table.data td { border-bottom: 1px solid hsl(0 0% 100% / .04); }
  /* 数字列自动等宽对齐 */
  table.data td[style*="text-align:right"], table.data td[style*="text-align: right"] { font-family: var(--font-mono); }
  table.data tr { transition: background-color .12s; }
  table.data tbody tr:hover { background: hsl(0 0% 100% / .04); }
  table.data tr:last-child td { border-bottom: none; }

  @keyframes tableEnter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  table.data tbody tr { animation: .2s cubic-bezier(.33,1,.68,1) tableEnter; }
  table.data tbody tr:nth-child(2) { animation-delay: .02s; }
  table.data tbody tr:nth-child(3) { animation-delay: .04s; }
  table.data tbody tr:nth-child(4) { animation-delay: .06s; }
  table.data tbody tr:nth-child(5) { animation-delay: .08s; }

  /* ── 按钮：触觉反馈 + 主按钮微光 ── */
  .btn { font-size: 12px; padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); cursor: pointer; font-family: var(--font); transition: background .15s, border-color .15s, transform .08s var(--ease-out), box-shadow .15s; color: var(--text); font-weight: 500; }
  .btn:hover { background: var(--secondary); border-color: var(--border-secondary); }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px hsla(219.7 100% 44.9% / .35); }
  .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  .btn-primary:hover { background: hsl(0 0% 90%); border-color: hsl(0 0% 90%); }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-accent:hover { background: hsl(219.7 100% 50%); box-shadow: var(--glow-accent); }
  .btn-danger { border-color: hsla(359.2 100% 69.7% / .25); color: var(--danger); }
  .btn-danger:hover { background: hsla(359.2 100% 69.7% / .1); border-color: hsla(359.2 100% 69.7% / .35); }

  /* ── 表单 ── */
  input, select, textarea { font-size: 13px; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font); background: var(--card); color: var(--text); transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px hsla(219.7 100% 44.9% / .2); }
  select { width: 100%; }
  select option { background: #1a1a1a; color: var(--text); }

  /* ── 组件 ── */
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .status-dot.ok { background: var(--success); }
  .status-dot.warn { background: var(--warning); }
  .status-dot.err { background: var(--danger); }
  .spinner { width: 14px; height: 14px; border: 2px solid hsl(0 0% 100% / .1); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .tag-ok { background: hsla(160.3 100% 36.8% / .15); color: var(--success); }
  .tag-warn { background: hsla(35.9 100% 50% / .15); color: var(--warning); }
  .tag-danger { background: hsla(359.2 100% 69.7% / .12); color: var(--danger); }
  .tag-info { background: hsla(199 100% 47.5% / .12); color: var(--info); }

  /* ── 治理卡片专用样式 ── */
  .review-card { transition: border-color .15s var(--ease-out), background .15s var(--ease-out); }
  .review-card:hover { background: hsla(219.7 100% 44.9% / .04); }
  .debate-section { transition: border-color .15s var(--ease-out); }
  .debate-section:hover { border-color: hsl(0 0% 100% / .08); }

  /* ── 布局工具 ── */
  .flex { display: flex; align-items: center; gap: 8px; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .text-secondary { color: var(--muted); font-size: 12px; }
  .mt-sm { margin-top: 8px; } .mt-md { margin-top: 16px; }
  .mb-sm { margin-bottom: 8px; } .mb-md { margin-bottom: 16px; }

  /* ── 骨架屏 (暗色) ── */
  .skeleton { background: linear-gradient(90deg, hsl(0 0% 16%) 25%, hsl(0 0% 20%) 50%, hsl(0 0% 16%) 75%); background-size: 200% 100%; animation: shimmer 1.8s ease-in-out infinite; border-radius: var(--radius-sm); height: 14px; margin-bottom: 6px; }
  @keyframes shimmer { 0%{background-position:200% 0} to{background-position:-200% 0} }

  /* ── 响应式 ── */
  @media (max-width: 768px) {
    .sidebar { width: 56px; }
    .sidebar .brand { font-size: 0; padding: 16px 12px; }
    .sidebar .nav-item { justify-content: center; padding: 10px; }
    .sidebar .nav-item .icon { margin: 0; }
    .sidebar .nav-item .label { display: none; }
    .sidebar .footer { display: none; }
    .main { margin-left: 56px; }
    .content { padding: 16px; }
    :root { --sidebar-w: 56px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tab-content.active { animation: none; }
    table.data tbody tr { animation: none; }
    .skeleton { animation: none; background: hsl(0 0% 16%); }
  }
</style>
</head>
<body>

<!-- ════ 全局 Toast ──── -->
<div id="global-toast"></div>

<!-- ════ 布局：侧边栏 + 主区域 ──── -->
<div class="layout">

<!-- ════ 侧边栏 ──── -->
<aside class="sidebar" id="sidebar">
  <div class="brand"><a href="/"><span class="logo-mark">蒸</span><span>投资信号蒸馏台</span></a></div>
  <nav class="nav" id="sidebar_nav"></nav>
  <div class="footer">
    <span id="sidebar_status">加载中...</span>
    <span style="float:right"><span class="status-dot" id="sb_pulse" style="display:inline-block"></span></span>
  </div>
</aside>

<!-- ════ 主区域 ──── -->
<main class="main">
  <div class="topbar">
    <span id="topbar_title" class="title">今日信号</span>
    <span class="sep"></span>
    <span class="status-text" id="sb_daemon">加载中...</span>
    <span class="sep"></span>
    <span class="status-text">今日 <strong id="sb_today">-</strong> 条</span>
    <span class="sep"></span>
    <span class="status-text">累计 <strong id="sb_total">-</strong></span>
    <span class="spacer"></span>
    <span class="status-text" id="sb_updated"></span>
  </div>
  <div class="content">
    <div id="tab_contents"></div>
  </div>
</main>

</div>

<script>
// ═══════════════════════════════════════════════════════════
// 全局运行时状态
// ═══════════════════════════════════════════════════════════
var ALL_CARDS = [];
var TABS = [];
var TAB_CARDS = {};
var CARD_META = {};
var CACHE = {};
var LAST_FETCH = {};
var REFRESH_MAP = {};
var CHAT_STATE = { question: '', answerHtml: '等待提问...', requestId: 0, loading: false };

async function apiFetch(url, options) {
  try {
    var res = await fetch(url, options);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    showToast('请求失败: ' + e.message);
    console.error('[apiFetch]', url, e);
    return null;
  }
}

function showToast(msg, duration) {
  var el = document.getElementById('global-toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._tid);
  el._tid = setTimeout(function() { el.classList.remove('show'); }, duration || 4000);
}

// 支持浏览器前进/后退切换标签
window.addEventListener('hashchange', function() {
  var tabKey = window.location.hash.replace('#', '');
  if (tabKey && TABS.some(function(t) { return t.key === tabKey; })) {
    switchTab(tabKey);
  }
});

// ═══════════════════════════════════════════════════════════
// 元数据加载 → 构建侧边栏 + 卡片分组
// ═══════════════════════════════════════════════════════════
var TAB_ICONS = {
  signals: '📡',
  decisions: '🎯',
  research: '🔍',
  data: '🗄️',
  settings: '⚙️'
};

async function bootstrap() {
  var meta = await apiFetch('/cards/meta');
  if (!meta || !meta.length) { showToast('无法加载卡片元数据'); return; }
  ALL_CARDS = meta;
  meta.forEach(function(c) { CARD_META[c.name] = c; REFRESH_MAP[c.name] = c.refresh; });

  // 去重 + 排序标签页
  var tabMap = {};
  meta.forEach(function(c) {
    if (!tabMap[c.tab]) tabMap[c.tab] = { key: c.tab, label: c.tab_label, order: c.tab_order };
  });
  TABS = Object.values(tabMap).sort(function(a, b) { return a.order - b.order; });

  // 按 tab 分组 + 排序
  TAB_CARDS = {};
  meta.forEach(function(c) {
    if (!TAB_CARDS[c.tab]) TAB_CARDS[c.tab] = [];
    TAB_CARDS[c.tab].push(c);
  });
  Object.keys(TAB_CARDS).forEach(function(t) {
    TAB_CARDS[t].sort(function(a, b) { return a.order - b.order; });
  });

  renderSidebar();
  // URL hash 优先 → sessionStorage 兜底 → 第一个标签
  var hashTab = window.location.hash.replace('#', '');
  var lastTab = (hashTab && TABS.some(function(t) { return t.key === hashTab; }))
    ? hashTab
    : (sessionStorage.getItem('lastTab') || (TABS[0] ? TABS[0].key : ''));
  if (!TABS.some(function(t) { return t.key === lastTab; })) {
    lastTab = TABS[0] ? TABS[0].key : '';
  }
  switchTab(lastTab);
  updateStatusBar();
  setInterval(autoRefresh, 5000);
}

function renderSidebar() {
  var nav = document.getElementById('sidebar_nav');
  nav.innerHTML = '';
  TABS.forEach(function(t) {
    var item = document.createElement('div');
    item.className = 'nav-item';
    item.setAttribute('data-tab', t.key);
    item.innerHTML = '<span class="icon">' + (TAB_ICONS[t.key] || '') + '</span><span class="label">' + t.label + '</span>';
    nav.appendChild(item);
  });
}

function switchTab(tabKey) {
  sessionStorage.setItem('lastTab', tabKey);
  // URL 同步：切换标签时更新 hash，支持浏览器前进/后退
  try { history.replaceState(null, '', '#' + tabKey); } catch(e) {}
  document.querySelectorAll('.nav-item').forEach(function(item) {
    item.classList.toggle('active', item.getAttribute('data-tab') === tabKey);
  });
  var tab = TABS.find(function(t) { return t.key === tabKey; });
  if (tab) document.getElementById('topbar_title').textContent = tab.label;

  document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
  var el = document.getElementById('tab-' + tabKey);
  if (el) el.classList.add('active');
  loadCards(tabKey);
}

// ═══════════════════════════════════════════════════════════
// 卡片加载
// ═══════════════════════════════════════════════════════════
async function loadCards(tabKey) {
  var container = document.getElementById('tab-' + tabKey);
  if (!container) {
    var contents = document.getElementById('tab_contents');
    container = document.createElement('div');
    container.id = 'tab-' + tabKey;
    container.className = 'tab-content';
    contents.appendChild(container);
  }
  var cards = TAB_CARDS[tabKey] || [];
  if (!cards.length) return;

  var allCached = cards.every(function(c) { return !!CACHE[c.name]; });
  if (allCached) {
    container.innerHTML = cards.map(function(c) { return CACHE[c.name].html; }).join('');
    postRender(container, cards);
    container.classList.add('active');
    return;
  }

  container.innerHTML = cards.map(function(c) {
    if (CACHE[c.name]) return CACHE[c.name].html;
    return '<div id="card-' + c.name + '" class="card" data-card="' + c.name + '"><div class="flex"><div class="spinner"></div><span class="text-secondary">加载中...</span></div></div>';
  }).join('');
  container.classList.add('active');

  var promises = cards.map(async function(c) {
    if (CACHE[c.name]) {
      var el = document.getElementById('card-' + c.name);
      if (el) { el.innerHTML = CACHE[c.name].html; el.setAttribute('data-card', c.name); }
      return;
    }
    var result = await apiFetch('/cards/' + c.name);
    if (!result || result.error) {
      CACHE[c.name] = { html: '<div class="flex"><div class="status-dot err"></div><span class="text-secondary">加载失败</span><button class="btn" style="margin-left:8px;font-size:10px" data-action="retry-card" data-card="' + c.name + '">重试</button></div>', data: {} };
    } else {
      CACHE[c.name] = { html: result.html, data: result.data || {} };
      LAST_FETCH[c.name] = Date.now();
    }
    var el = document.getElementById('card-' + c.name);
    if (el) { el.innerHTML = CACHE[c.name].html; el.setAttribute('data-card', c.name); }
  });
  await Promise.all(promises);
  postRender(container, cards);
}

function retryCard(name) {
  delete CACHE[name];
  var el = document.getElementById('card-' + name);
  if (el) el.innerHTML = '<div class="flex"><div class="spinner"></div><span class="text-secondary">重新加载...</span></div>';
  for (var t in TAB_CARDS) {
    for (var i = 0; i < TAB_CARDS[t].length; i++) {
      if (TAB_CARDS[t][i].name === name) { loadCards(t); return; }
    }
  }
}

function postRender(container, cards) {
  cards.forEach(function(c) {
    var meta = CARD_META[c.name];
    if (!meta) return;
    var el = document.getElementById('card-' + c.name);
    if (!el) return;
    el.setAttribute('data-card', c.name);
    if (meta.is_headline) el.classList.add('card-headline');
    if (meta.span_full) el.style.gridColumn = '1 / -1';
    // 注入一句话功能说明（命名优化层）：插到卡片标题正下方，仅注入一次
    if (meta.subtitle && !el.querySelector('.card-subtitle')) {
      var titleEl = el.querySelector('.card-title');
      if (titleEl) {
        var sub = document.createElement('div');
        sub.className = 'card-subtitle';
        sub.textContent = meta.subtitle;
        titleEl.insertAdjacentElement('afterend', sub);
      }
    }
    if (c.name === 'chat') hydrateChatState();
  });
}

function cardEl(cardName, selector) {
  var container = document.getElementById('card-' + cardName);
  return container ? container.querySelector(selector) : null;
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"]/g, function(ch) {
    return ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[ch];
  });
}

function hydrateChatState() {
  var input = cardEl('chat', '#chat-question');
  var answer = cardEl('chat', '#chat-answer');
  if (input) input.value = CHAT_STATE.question || '';
  if (answer) answer.innerHTML = CHAT_STATE.answerHtml || '等待提问...';
}

function setChatAnswerHtml(html) {
  CHAT_STATE.answerHtml = html;
  var answer = cardEl('chat', '#chat-answer');
  if (answer) answer.innerHTML = html;
}

function fillChatQuestion(question) {
  var input = cardEl('chat', '#chat-question');
  if (input && question) {
    input.value = question;
    CHAT_STATE.question = question;
  }
}

async function askChat() {
  var input = cardEl('chat', '#chat-question');
  if (!input) return;
  var question = input.value.trim();
  CHAT_STATE.question = question;
  if (!question) { setChatAnswerHtml('请先输入问题'); return; }
  CHAT_STATE.requestId += 1;
  CHAT_STATE.loading = true;
  var requestId = CHAT_STATE.requestId;
  setChatAnswerHtml('<div class="flex"><div class="spinner"></div><span class="text-secondary">正在检索历史观点...</span></div>');
  var result = await apiFetch('/cards/chat/action', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'ask', question: question, top_k: 5})
  });
  if (requestId !== CHAT_STATE.requestId) return;
  CHAT_STATE.loading = false;
  if (result && result.ok) {
    setChatAnswerHtml(escapeHtml(result.answer || '未生成回答'));
  } else {
    setChatAnswerHtml('问答失败: ' + escapeHtml((result && result.error) || '未知错误'));
  }
}

// ═══════════════════════════════════════════════════════════
// 自动刷新
// ═══════════════════════════════════════════════════════════
async function autoRefresh() {
  var active = document.querySelector('.tab-content.active');
  if (!active) return;
  var tabKey = active.id.replace('tab-', '');
  var cards = TAB_CARDS[tabKey] || [];
  var now = Date.now();
  for (var i = 0; i < cards.length; i++) {
    var name = cards[i].name;
    var interval = (REFRESH_MAP[name] || 0) * 1000;
    if (interval <= 0) continue;
    if (now - (LAST_FETCH[name] || 0) <= interval) continue;
    var result = await apiFetch('/cards/' + name);
    if (!result || result.error) continue;
    var newHtml = result.html;
    if (CACHE[name] && CACHE[name].html === newHtml) continue;
    CACHE[name] = { html: newHtml, data: result.data || {} };
    LAST_FETCH[name] = Date.now();
    var el = document.getElementById('card-' + name);
    if (el) { el.innerHTML = newHtml; el.classList.add('card-flash'); setTimeout(function() { el.classList.remove('card-flash'); }, 600); }
    el && el.dispatchEvent(new CustomEvent('cardRefreshed', { bubbles: true }));
  }
  updateStatusBar();
}

// ═══════════════════════════════════════════════════════════
// 全局事件委托 — data-action 驱动的交互路由

// 提取共享分发逻辑，供 click 和 change 事件复用

    case 'fill-chat-question': fillChatQuestion(el.getAttribute('data-question')); break;
    case 'toggle-daemon': toggleDaemon(); break;
    case 'test-telegram': sendTestMsg(); break;
    case 'save-telegram': saveTelegram(); break;
    case 'fetch-manual': fetchManually(); break;
    case 'gen-pick': generatePick(); break;
    case 'analyze-portfolio': analyzePortfolio(); break;
    case 'gen-portrait': genPortraitAdv(); break;
    case 'seed-tasks': seedTasksPE(); break;
    case 'run-clean': runCleanAlias(); break;
    case 'add-alias': addAlias(cardName); break;
    case 'toggle-scripts': toggleScriptTools(); break;
    case 'add-user': addTrackedUser(); break;
    case 'exec-pipeline': execPipeline(el.getAttribute('data-type')); break;
    case 'select-all-pe': selectAllPE(el.getAttribute('data-type')); break;
    case 'clear-all-pe': clearAllPE(el.getAttribute('data-type')); break;
    case 'retry-task': retryTaskPE(el.getAttribute('data-id')); break;
    case 'skip-task': skipTaskPE(el.getAttribute('data-id')); break;
    case 'load-type-pe': loadTypePE(el.getAttribute('data-type')); break;
    case 'select-window': selectWindow(el.getAttribute('data-label')); break;
    case 'edit-alias': editAliasRow(cardName, el.getAttribute('data-alias'), el.getAttribute('data-ticker'), el.getAttribute('data-notes')); break;
    case 'delete-alias': deleteAlias(cardName, el.getAttribute('data-alias')); break;
    case 'fill-alias': fillAliasForm(cardName, el.getAttribute('data-alias'), el.getAttribute('data-notes')); break;
    case 'skip-alias': skipAlias(cardName, el.getAttribute('data-alias')); break;
    case 'unskip-alias': unskipAlias(cardName, el.getAttribute('data-alias')); break;
    case 'toggle-portrait': togglePortrait(el.getAttribute('data-id')); break;
    case 'run-script': runScript(el.getAttribute('data-script')); break;
    case 'retry-card': retryCard(cardName); break;
    case 'acknowledge-governance-gap': acknowledgeGovernanceGap(el); break;
    case 'revoke-governance-gap': revokeGovernanceGap(el); break;
    case 'update-pool': updatePool(); break;
    case 'save-config-llm': saveConfigLLM(); break;
    case 'save-config-twitter': saveConfigTwitter(); break;
    case 'save-config-telegram': saveConfigTelegram(); break;
    case 'add-observation': addObservation(); break;
    case 'remove-observation': removeObservation(el); break;
    case 'switch-tw-provider': switchTwProvider(el.getAttribute('data-tw-provider')); break;
  }
}

async function acknowledgeGovernanceGap(btn) {
  var signalId = btn.getAttribute('data-signal-id');
  var gapCode = btn.getAttribute('data-gap-code');
  var card = btn.closest('[data-card]');
  var reasonEl = card ? card.querySelector('[data-gap-reason="' + gapCode + '"]') : null;
  var expiresEl = card ? card.querySelector('[data-gap-expires="' + gapCode + '"]') : null;
  var reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) { showToast('请简单说明为什么暂时接受这个风险'); return; }
  btn.disabled = true;
  var result = await apiFetch('/api/governance/gaps/acknowledge', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({signal_id: signalId, gap_code: gapCode, reason: reason, expires_in_hours: expiresEl ? expiresEl.value : 72})
  });
  btn.disabled = false;
  if (result && result.ok) { showToast('已保存，系统会重新检查这条信号'); await refreshGovernanceCards(); }
  else { showToast((result && result.error) || '操作没有保存成功'); }
}

async function revokeGovernanceGap(btn) {

  });
  btn.disabled = false;
  if (result && result.ok) { showToast('已重新检查这条信号'); await refreshGovernanceCards(); }
  else { showToast((result && result.error) || '操作没有保存成功'); }
}

}

async function addAlias(cardName) {

function sanitizeTrustedHtml(html) {
  var template = document.createElement('template');
  template.innerHTML = String(html || '');
  template.content.querySelectorAll('script, iframe, object, embed, link, meta').forEach(function(el) { el.remove(); });
  template.content.querySelectorAll('*').forEach(function(el) {
    Array.from(el.attributes).forEach(function(attr) {
      var name = attr.name.toLowerCase();
      var value = attr.value || '';
      if (name.indexOf('on') === 0 || value.toLowerCase().indexOf('javascript:') === 0) el.removeAttribute(attr.name);
    });
  });
  return template.innerHTML;
}
