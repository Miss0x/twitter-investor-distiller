<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Twitter Investor Distiller</title>
<style>
  :root {
    --bg-primary: #ffffff; --bg-secondary: #f5f5f5; --bg-tertiary: #fafafa;
    --text-primary: #1a1a1a; --text-secondary: #666666; --text-tertiary: #999999;
    --text-success: #1D9E75; --text-warning: #EF9F27; --text-info: #378ADD; --text-danger: #E24B4A;
    --border-primary: rgba(0,0,0,0.2); --border-secondary: rgba(0,0,0,0.12); --border-tertiary: rgba(0,0,0,0.07);
    --radius-md: 8px; --radius-lg: 12px;
    --font: system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); font-size: 13px; color: var(--text-primary); background: var(--bg-tertiary); line-height: 1.6; }
  .app { max-width: 960px; margin: 0 auto; padding: 20px 24px; }
  .header { margin-bottom: 20px; }
  .header h1 { font-size: 16px; font-weight: 500; }
  .header p { font-size: 12px; color: var(--text-secondary); }
  .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 0.5px solid var(--border-tertiary); }
  .tab { padding: 8px 16px; font-size: 13px; color: var(--text-secondary); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--text-primary); font-weight: 500; border-bottom-color: var(--text-primary); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .card { background: var(--bg-primary); border: 0.5px solid var(--border-tertiary); border-radius: var(--radius-lg); padding: 14px 16px; }
  .card-title { font-size: 13px; font-weight: 500; margin-bottom: 10px; color: var(--text-primary); }
  .metric { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 12px; }
  .metric-label { font-size: 11px; color: var(--text-secondary); }
  .metric-value { font-size: 20px; font-weight: 500; margin-top: 2px; }
  .metric-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data th, table.data td { padding: 6px 10px; text-align: left; }
  table.data th { background: var(--bg-secondary); color: var(--text-secondary); font-weight: 400; font-size: 11px; }
  table.data td { border-top: 0.5px solid var(--border-tertiary); }
  .btn { font-size: 12px; padding: 5px 14px; border: 0.5px solid var(--border-secondary); border-radius: var(--radius-md); background: var(--bg-primary); cursor: pointer; font-family: var(--font); }
  .btn:hover { border-color: var(--border-primary); }
  .btn-primary { border-color: var(--text-primary); font-weight: 500; }
  .btn-danger { border-color: var(--text-danger); color: var(--text-danger); }
  input, select, textarea { font-size: 13px; padding: 6px 10px; border: 0.5px solid var(--border-tertiary); border-radius: var(--radius-md); font-family: var(--font); background: var(--bg-primary); }
  input:focus, select:focus { outline: none; border-color: var(--border-primary); }
  select { width: 100%; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-dot.ok { background: var(--text-success); }
  .status-dot.warn { background: var(--text-warning); }
  .status-dot.err { background: var(--text-danger); }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border-tertiary); border-top-color: var(--text-primary); border-radius: 50%; animation: spin .6s linear infinite; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .tag-ok { background: rgba(29,158,117,0.1); color: var(--text-success); }
  .tag-warn { background: rgba(239,159,39,0.1); color: var(--text-warning); }
  .flex { display: flex; align-items: center; gap: 8px; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .text-secondary { color: var(--text-secondary); font-size: 12px; }
  .mt-sm { margin-top: 8px; }
  .mt-md { margin-top: 16px; }
  .mb-sm { margin-bottom: 8px; }
  .mb-md { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="app">
<div class="header">
  <h1>Twitter Investor Distiller</h1>
  <p>抓取 → 分析 → 画像 → 信号</p>
</div>
<div class="tabs">
  <button class="tab active" onclick="switchTab('dashboard')">抓取仪表盘</button>
  <button class="tab" onclick="switchTab('pipeline')">推文分析</button>
  <button class="tab" onclick="switchTab('portraits')">分析师画像</button>
  <button class="tab" onclick="switchTab('insights')">信号与洞察</button>
</div>
<div id="tab-dashboard" class="tab-content active"></div>
<div id="tab-pipeline" class="tab-content"></div>
<div id="tab-portraits" class="tab-content"></div>
<div id="tab-insights" class="tab-content"></div>
</div>
<script>
const CARD_ORDER = {
  dashboard: ["system_status","daemon","fetch_control","telegram","accuracy","api_status"],
  pipeline: ["pipeline_execute","asset_alias","script_runner"],
  portraits: ["portrait_generate","portrait"],
  insights: ["role_picker","portfolio","consensus","rotation","crypto","anomaly","timeline","network"]
};

const cache = {};         // 卡片 HTML 缓存
const REFRESH_MAP = {};   // 刷新间隔
const LAST_FETCH = {};    // 上次拉取时间戳

// 让 innerHTML 中的 <script> 标签重新执行
function reanimateScripts(container) {
  container.querySelectorAll('script').forEach(function(s) {
    var ns = document.createElement('script');
    Array.from(s.attributes).forEach(function(a) { ns.setAttribute(a.name, a.value); });
    ns.textContent = s.textContent;
    s.replaceWith(ns);
  });
}

function switchTab(tab) {
  const labels = {dashboard:'抓取', pipeline:'推文分析', portraits:'画像', insights:'洞察'};
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.textContent.includes(labels[tab]));
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  loadCards(tab);
}

async function loadCards(tab) {
  const container = document.getElementById('tab-' + tab);
  const names = CARD_ORDER[tab] || [];
  
  const hasCache = names.filter(n => !!cache[n]);

  // 已缓存的直接渲染，无填充骨架
  if (hasCache.length === names.length) {
    container.innerHTML = names.map(n => cache[n]).join('');
    reanimateScripts(container);
    return;
  }

  // 部分缓存：显示已缓存的 + 骨架
  container.innerHTML = names.map(n =>
    cache[n] || ('<div id="card-'+n+'" class="card" style="margin-bottom:12px">' +
    '<div class="flex"><div class="spinner"></div><span class="text-secondary">加载中...</span></div>' +
    '</div>')
  ).join('');
  reanimateScripts(container);

  const toFetch = names.filter(n => !cache[n]);

  // 并行拉取
  const promises = names.map(async (name) => {
    if (toFetch.includes(name)) {
      try {
        const resp = await fetch('/cards/' + name);
        const html = await resp.text();
        cache[name] = html;
        LAST_FETCH[name] = Date.now();
      } catch (e) {
        cache[name] = '<div class="flex"><div class="status-dot err"></div><span class="text-secondary">加载失败</span></div>';
      }
    }
    // 从缓存渲染
    const el = document.getElementById('card-' + name);
    if (el) { el.innerHTML = cache[name]; reanimateScripts(el); }
  });

  await Promise.all(promises);
  // 流水线卡片初始加载：默认显示过滤筛选 tab
  if (tab === 'pipeline') { requestAnimationFrame(function() { loadTypePE('filter'); }); }
  attachButtons();
}

// 后台自动刷新（仅活跃 tab）
var PIPELINE_EXECUTE_REFRESHED = false;
async function autoRefresh() {
  const active = document.querySelector('.tab-content.active');
  if (!active) return;
  const tabName = active.id.replace('tab-','');
  const names = CARD_ORDER[tabName] || [];
  const now = Date.now();
  for (const name of names) {
    const interval = (REFRESH_MAP[name] || 0) * 1000;
    if (interval > 0 && now - (LAST_FETCH[name] || 0) > interval) {
      try {
        const resp = await fetch('/cards/' + name);
        const html = await resp.text();
        // 内容没变就不动 DOM，避免无意义重排/跳动
        if (cache[name] === html) { continue; }
        cache[name] = html;
        LAST_FETCH[name] = Date.now();
        const el = document.getElementById('card-' + name);
        if (el) { el.innerHTML = html; reanimateScripts(el); }
        if (name === 'pipeline_execute') PIPELINE_EXECUTE_REFRESHED = true;
      } catch(e) {}
    }
  }
  // 若 pipeline_execute 被刷新，恢复之前选中类型
  if (PIPELINE_EXECUTE_REFRESHED && tabName === 'pipeline') {
    PIPELINE_EXECUTE_REFRESHED = false;
    setTimeout(function() { loadTypePE(PE_ACTIVE); }, 50);
  }
}

async function toggleDaemon() {
  const btn = document.getElementById('daemon-btn');
  if (!btn) return;
  btn.disabled = true;
  try {
    await fetch('/cards/daemon/action', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'toggle'})
    });
  } catch(e) {}
  try {
    const resp = await fetch('/cards/daemon');
    cache.daemon = await resp.text();
    const el = document.getElementById('card-daemon');
    if (el) { el.innerHTML = cache.daemon; reanimateScripts(el); }
  } catch(e) {}
}

// ── 流水线执行函数 ──
var PE_ACTIVE = 'filter';

function loadTypePE(t) {
  PE_ACTIVE = t;
  document.querySelectorAll('.pe-container').forEach(function(e) { e.style.display = 'none'; });
  document.querySelectorAll('.pe-tab').forEach(function(e) { e.classList.remove('active'); });
  var c = document.getElementById('pe-type-' + t);
  if (c) c.style.display = 'block';
  var tab = document.getElementById('tab-' + t);
  if (tab) tab.classList.add('active');
}

function selectAllPE(t) {
  document.querySelectorAll('.pe-cb-' + t).forEach(function(c) { c.checked = true; });
}

function clearAllPE(t) {
  document.querySelectorAll('.pe-cb-' + t).forEach(function(c) { c.checked = false; });
}

async function execPipeline(t) {
  var ids = [];
  document.querySelectorAll('.pe-cb-' + t + ':checked').forEach(function(c) { ids.push(c.value); });
  if (!ids.length) return;
  var s = document.getElementById('pe-msg');
  if (s) s.innerText = '执行中...';
  try {
    var r = await fetch('/pipeline/tasks/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task_ids: ids })
    });
    if (s) s.innerText = '已提交 ' + ids.length + ' 个';
    setTimeout(function() { location.reload(); }, 2000);
  } catch (e) {
    if (s) s.innerText = '网络错误';
  }
}

async function retryTaskPE(id) {
  await fetch('/pipeline/tasks/' + id + '/retry', { method: 'POST' });
  location.reload();
}

async function skipTaskPE(id) {
  await fetch('/pipeline/tasks/' + id + '/skip', { method: 'POST' });
  location.reload();
}

async function filterNewTweetsPE() {
  var s = document.getElementById('pe-msg');
  if (s) s.innerText = '扫描中...';
  try {
    await fetch('/pipeline/filter', { method: 'POST' });
    if (s) s.innerText = '完成';
  } catch (e) {
    if (s) s.innerText = '失败';
  }
  setTimeout(function() { location.reload(); }, 1500);
}

async function seedTasksPE() {
  await fetch('/pipeline/tasks/seed', { method: 'POST' });
  location.reload();
}

// ── 画像生成 ──
function selectWindow(label) {
  document.getElementById('pg_window').value = label;
  document.querySelectorAll('.pg-win-btn').forEach(function(b) { b.classList.remove('selected'); });
  var btn = document.getElementById('pg_win_' + label);
  if (btn) btn.classList.add('selected');
  // 选窗口后清空日历
  document.getElementById('pg_from').value = '';
  document.getElementById('pg_to').value = '';
}

async function genPortraitAdv() {
  var u = document.getElementById('pg_user').value;
  var w = document.getElementById('pg_window').value;
  var from = document.getElementById('pg_from').value;
  var to = document.getElementById('pg_to').value;
  var label = document.getElementById('pg_label').value.trim();
  var s = document.getElementById('pg_status');

  if (!w && !from) { if(s)s.innerText='请先选择时间窗口或日期'; return; }
  if ((from && !to) || (!from && to)) { if(s)s.innerText='日期范围需同时填写起止'; return; }

  if (s) s.innerText = '生成中...';
  try {
    var r = await fetch('/cards/portrait_generate/action', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user: u, window: w, from: from, to: to, label: label })
    });
    var d = await r.json();
    if (s) s.innerText = d.ok ? '任务已创建 #'+d.task_id : '失败: '+(d.error||'');
    if (d.ok) setTimeout(function(){location.reload();}, 1500);
  } catch(e) { if(s) s.innerText='网络错误'; }
}

// ── 资产代码库操作 ──
function editAliasRow(alias, ticker, notes) {
  document.getElementById('aa_alias').value = alias;
  document.getElementById('aa_ticker').value = ticker || '';
  document.getElementById('aa_notes').value = notes || '';
  document.getElementById('aa_old_alias').value = alias;
  document.getElementById('btn_aa_submit').innerText = '更新';
}

function fillAliasForm(alias, notes) {
  document.getElementById('aa_alias').value = alias;
  document.getElementById('aa_ticker').value = '';
  document.getElementById('aa_notes').value = notes || '';
  document.getElementById('aa_old_alias').value = alias;
  document.getElementById('btn_aa_submit').innerText = '确认';
  document.getElementById('aa_ticker').focus();
}

async function addAlias() {
  var alias = document.getElementById('aa_alias').value.trim();
  var ticker = document.getElementById('aa_ticker').value.trim();
  var notes = document.getElementById('aa_notes').value.trim();
  var old = document.getElementById('aa_old_alias').value.trim();
  var action = old ? 'edit' : 'add';
  if (!alias) { setStatus('aa_status','别名不能为空'); return; }
  setStatus('aa_status', (action === 'edit' ? '更新中...' : '添加中...'));
  try {
    var r = await fetch('/cards/asset_alias/action', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: action, alias: alias, ticker: ticker, notes: notes, old_alias: old})
    });
    var d = await r.json();
    if (d.ok) { setStatus('aa_status', '成功'); document.getElementById('btn_aa_submit').innerText = '添加'; document.getElementById('aa_old_alias').value = ''; location.reload(); }
    else { setStatus('aa_status', d.error); }
  } catch(e) { setStatus('aa_status', '网络错误'); }
}

async function deleteAlias(alias) {
  if (!confirm('确定删除 "' + alias + '" 吗？')) return;
  setStatus('aa_status', '删除中...');
  try {
    var r = await fetch('/cards/asset_alias/action', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'delete', alias: alias})
    });
    var d = await r.json();
    if (d.ok) { location.reload(); }
    else { setStatus('aa_status', d.error); }
  } catch(e) { setStatus('aa_status', '网络错误'); }
}

function setStatus(id, msg) {
  var el = document.getElementById(id);
  if (el) el.innerText = msg;
}

// ── 画像展开/收起 ──
function togglePortrait(id) {
  var body = document.getElementById('portrait-body-' + id);
  if (!body) return;
  body.style.display = body.style.display === 'none' ? 'block' : 'none';
}

// ── 用户管理 ──
async function addTrackedUser() {
  var u = document.getElementById('um_user').value.trim();
  var s = document.getElementById('um_status');
  if (!u) { if(s)s.innerText='请输入用户名'; return; }
  if (s) s.innerText = '校验中...';
  try {
    var r = await fetch('/cards/api_status/action', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'add_user', user: u})
    });
    var d = await r.json();
    if (d.ok) { if(s)s.innerText = '已添加 @'+u+' (粉丝: '+d.followers+')'; setTimeout(function(){location.reload();},1500); }
    else { if(s)s.innerText = d.error; }
  } catch(e) { if(s)s.innerText = '网络错误'; }
}

// ── 脚本工具箱折叠 ──
function toggleScriptTools() {
  var body = document.getElementById('script_tools_body');
  var btn = document.getElementById('btn_toggle_tools');
  if (!body || !btn) return;
  if (body.style.display === 'none') {
    body.style.display = 'block';
    btn.innerText = '收起';
  } else {
    body.style.display = 'none';
    btn.innerText = '展开';
  }
}

// ── 脚本工具箱 ──
async function runScript(name){
  var s=document.getElementById("sr_status"); if(s) s.innerText="运行 scripts/" + name + "...";
  try{
    var r=await fetch("/cards/script_runner/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({script:name})});
    var d=await r.json(); if(s) s.innerText=d.ok?"完成: "+d.output:d.error;
    setTimeout(function(){location.reload();},1500);
  }catch(e){ if(s) s.innerText="网络错误"; }
}

// ── 启动 ──
fetch('/cards/meta').then(r => r.json()).then(cards => {
  cards.forEach(c => { REFRESH_MAP[c.name] = c.refresh; });
  loadCards('dashboard');
  setInterval(autoRefresh, 5000);
});
</script>
</body>
</html>
