<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Twitter Investor Distiller</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* 紧急内联补丁：页面首次加载时的骨架屏撑满 */
    .skeleton-card { min-height: 120px; }
    .skeleton-card .skeleton:last-child { width: 45%; }
  </style>
</head>
<body>
<div id="offline-banner" style="display:none">⚠️ 网络已断开，部分功能不可用</div>

<!-- ════ 全局 Toast ──── -->
<div id="global-toast"></div>

<!-- ════ 布局：侧边栏 + 主区域 ──── -->
<div class="layout">

<!-- ════ 侧边栏 ──── -->
<aside class="sidebar" id="sidebar">
  <div class="brand"><a href="/"><span class="logo-mark">蒸</span><span>投资信号蒸馏台</span></a></div>
  <nav class="nav" id="sidebar_nav"></nav>
  <div class="footer">
    <span id="sidebar_status">加载中...</span>
    <span style="float:right"><span class="status-dot" id="sb_pulse" style="display:inline-block"></span></span>
  </div>
</aside>

<!-- ════ 主区域 ──── -->
<main class="main">
  <div class="topbar">
    <span id="topbar_title" class="title">今日信号</span>
    <span class="sep"></span>
    <span class="status-text" id="sb_daemon">加载中...</span>
    <span class="sep"></span>
    <span class="status-text">今日 <strong id="sb_today">-</strong> 条</span>
    <span class="sep"></span>
    <span class="status-text">累计 <strong id="sb_total">-</strong></span>
    <span class="spacer"></span>
    <span class="status-text" id="sb_updated"></span>
  </div>
  <div class="content">
    <div id="tab_contents"></div>
  </div>
</main>

</div>

<script>
// ═══════════════════════════════════════════════════════════
// 全局运行时状态
// ═══════════════════════════════════════════════════════════
var ALL_CARDS = [];
var TABS = [];
var TAB_CARDS = {};
var CARD_META = {};
var CACHE = {};
var LAST_FETCH = {};
var REFRESH_MAP = {};
var CHAT_STATE = { question: '', answerHtml: '等待提问...', requestId: 0, loading: false };
var _pageVisible = true;  // 页面前台可见性

// ── 页面可见性：标签页后台时不刷新 ──
document.addEventListener('visibilitychange', function() {
  _pageVisible = document.visibilityState === 'visible';
});

// ── 网络状态监听 ──
window.addEventListener('offline', function() {
  document.getElementById('offline-banner').style.display = 'block';
});
window.addEventListener('online', function() {
  document.getElementById('offline-banner').style.display = 'none';
  showToast('网络已恢复');
});

async function apiFetch(url, options) {
  try {
    var res = await fetch(url, options);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    showToast('请求失败: ' + e.message);
    console.error('[apiFetch]', url, e);
    return null;
  }
}

function showToast(msg, duration) {
  var el = document.getElementById('global-toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._tid);
  el._tid = setTimeout(function() { el.classList.remove('show'); }, duration || 4000);
}

// 支持浏览器前进/后退切换标签
window.addEventListener('hashchange', function() {
  var tabKey = window.location.hash.replace('#', '');
  if (tabKey && TABS.some(function(t) { return t.key === tabKey; })) {
    switchTab(tabKey);
  }
});

// ═══════════════════════════════════════════════════════════
// 元数据加载 → 构建侧边栏 + 卡片分组
// ═══════════════════════════════════════════════════════════
var TAB_ICONS = {
  signals: '📡',
  decisions: '🎯',
  research: '🔍',
  data: '🗄️',
  settings: '⚙️'
};

async function bootstrap() {
  var meta = await apiFetch('/cards/meta');
  if (!meta || !meta.length) { showToast('无法加载卡片元数据'); return; }
  ALL_CARDS = meta;
  meta.forEach(function(c) { CARD_META[c.name] = c; REFRESH_MAP[c.name] = c.refresh; });

  // 去重 + 排序标签页
  var tabMap = {};
  meta.forEach(function(c) {
    if (!tabMap[c.tab]) tabMap[c.tab] = { key: c.tab, label: c.tab_label, order: c.tab_order };
  });
  TABS = Object.values(tabMap).sort(function(a, b) { return a.order - b.order; });

  // 按 tab 分组 + 排序
  TAB_CARDS = {};
  meta.forEach(function(c) {
    if (!TAB_CARDS[c.tab]) TAB_CARDS[c.tab] = [];
    TAB_CARDS[c.tab].push(c);
  });
  Object.keys(TAB_CARDS).forEach(function(t) {
    TAB_CARDS[t].sort(function(a, b) { return a.order - b.order; });
  });

  renderSidebar();
  // URL hash 优先 → sessionStorage 兜底 → 第一个标签
  var hashTab = window.location.hash.replace('#', '');
  var lastTab = (hashTab && TABS.some(function(t) { return t.key === hashTab; }))
    ? hashTab
    : (sessionStorage.getItem('lastTab') || (TABS[0] ? TABS[0].key : ''));
  if (!TABS.some(function(t) { return t.key === lastTab; })) {
    lastTab = TABS[0] ? TABS[0].key : '';
  }
  switchTab(lastTab);
  updateStatusBar();
  setInterval(autoRefresh, 5000);
}

function renderSidebar() {
  var nav = document.getElementById('sidebar_nav');
  nav.innerHTML = '';
  TABS.forEach(function(t) {
    var item = document.createElement('div');
    item.className = 'nav-item';
    item.setAttribute('data-tab', t.key);
    item.innerHTML = '<span class="icon">' + (TAB_ICONS[t.key] || '') + '</span><span class="label">' + t.label + '</span>';
    nav.appendChild(item);
  });
}

function switchTab(tabKey) {
  sessionStorage.setItem('lastTab', tabKey);
  // URL 同步：切换标签时更新 hash，支持浏览器前进/后退
  try { history.replaceState(null, '', '#' + tabKey); } catch(e) {}
  document.querySelectorAll('.nav-item').forEach(function(item) {
    item.classList.toggle('active', item.getAttribute('data-tab') === tabKey);
  });
  var tab = TABS.find(function(t) { return t.key === tabKey; });
  if (tab) document.getElementById('topbar_title').textContent = tab.label;

  document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
  var el = document.getElementById('tab-' + tabKey);
  if (el) el.classList.add('active');
  loadCards(tabKey);
}

// ═══════════════════════════════════════════════════════════
// 卡片加载 + 骨架屏 + 自动重试 + 新鲜度
// ═══════════════════════════════════════════════════════════
function _skeletonHtml(c) {
  var title = CARD_META[c.name] ? (CARD_META[c.name].display_title || c.name) : c.name;
  return '<div id="card-' + c.name + '" class="card skeleton-card" data-card="' + c.name + '">'
    + '<div class="card-title">' + escapeHtml(title) + '</div>'
    + '<div class="skeleton" style="width:40%;height:16px;margin-bottom:10px"></div>'
    + '<div class="skeleton" style="width:85%"></div>'
    + '<div class="skeleton" style="width:65%"></div>'
    + '<div class="skeleton" style="width:50%"></div>'
    + '</div>';
}
function _errorHtml(c, msg) {
  return '<div class="flex flex-wrap" style="gap:8px"><div class="status-dot err"></div><span class="text-secondary">' + escapeHtml(msg || '加载失败') + '</span><button class="btn" style="font-size:10px" data-action="retry-card" data-card="' + c.name + '">重试</button></div>';
}
function _formatFreshness(ts) {
  if (!ts) return '';
  var sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 10) return '刚刚';
  if (sec < 60) return sec + '秒前';
  var min = Math.floor(sec / 60);
  if (min < 60) return min + '分钟前';
  var h = Math.floor(min / 60);
  return h + '小时前';
}
function _updateFreshness() {
  document.querySelectorAll('.freshness-badge').forEach(function(el) {
    var name = el.getAttribute('data-card');
    if (name && LAST_FETCH[name]) el.textContent = _formatFreshness(LAST_FETCH[name]);
  });
}

function _injectFreshness(el, name) {
  if (!el || el.querySelector('.freshness-badge')) return;
  var titleEl = el.querySelector('.card-title');
  if (!titleEl) return;
  var badge = document.createElement('span');
  badge.className = 'freshness-badge';
  badge.setAttribute('data-card', name);
  badge.textContent = _formatFreshness(LAST_FETCH[name]);
  titleEl.appendChild(badge);
}

async function loadCards(tabKey) {
  var container = document.getElementById('tab-' + tabKey);
  if (!container) {
    var contents = document.getElementById('tab_contents');
    container = document.createElement('div');
    container.id = 'tab-' + tabKey;
    container.className = 'tab-content';
    contents.appendChild(container);
  }
  var cards = TAB_CARDS[tabKey] || [];
  if (!cards.length) return;

  var allCached = cards.every(function(c) { return !!CACHE[c.name]; });
  if (allCached) {
    container.innerHTML = cards.map(function(c) { return CACHE[c.name].html; }).join('');
    postRender(container, cards);
    container.classList.add('active');
    cards.forEach(function(c) { _injectFreshness(document.getElementById('card-' + c.name), c.name); });
    _updateFreshness();
    return;
  }

  // 骨架屏占位
  container.innerHTML = cards.map(function(c) {
    if (CACHE[c.name]) return CACHE[c.name].html;
    return _skeletonHtml(c);
  }).join('');
  container.classList.add('active');

  var promises = cards.map(async function(c) {
    if (CACHE[c.name]) {
      var el = document.getElementById('card-' + c.name);
      if (el) { el.innerHTML = CACHE[c.name].html; el.setAttribute('data-card', c.name); }
      _injectFreshness(document.getElementById('card-' + c.name), c.name);
      return;
    }
    var result = await apiFetch('/cards/' + c.name);
    // 失败后自动重试一次（显示"重试中"提示）
    if (!result || result.error) {
      var retryEl = document.getElementById('card-' + c.name);
      if (retryEl) retryEl.innerHTML = '<div class="flex"><div class="spinner"></div><span class="text-secondary">连接失败，正在重试...</span></div>';
      await new Promise(function(r) { setTimeout(r, 2000); });
      if (!_pageVisible) {
        // 切走后不继续重试，但标记为待重试（切回来时 autoRefresh 会刷）
        if (retryEl) retryEl.innerHTML = _errorHtml(c, '页面在后台，请切回后刷新');
        return;
      }
      result = await apiFetch('/cards/' + c.name);
    }
    if (!result || result.error) {
      CACHE[c.name] = { html: _errorHtml(c, result ? result.error || result.message || '加载失败' : '网络错误'), data: {} };
    } else {
      LAST_FETCH[c.name] = Date.now();
      CACHE[c.name] = { html: result.html, data: result.data || {} };
    }
    var el = document.getElementById('card-' + c.name);
    if (el) { el.innerHTML = CACHE[c.name].html; el.setAttribute('data-card', c.name); }
    _injectFreshness(el, c.name);
  });
  await Promise.all(promises);
  postRender(container, cards);
}

// 每 30 秒更新一次新鲜度显示
setInterval(_updateFreshness, 30000);

function retryCard(name) {
  delete CACHE[name];
  var el = document.getElementById('card-' + name);
  if (el) el.innerHTML = _skeletonHtml({name: name});
  for (var t in TAB_CARDS) {
    for (var i = 0; i < TAB_CARDS[t].length; i++) {
      if (TAB_CARDS[t][i].name === name) { loadCards(t); return; }
    }
  }
}

function postRender(container, cards) {
  cards.forEach(function(c) {
    var meta = CARD_META[c.name];
    if (!meta) return;
    var el = document.getElementById('card-' + c.name);
    if (!el) return;
    el.setAttribute('data-card', c.name);
    if (meta.is_headline) el.classList.add('card-headline');
    if (meta.span_full) el.style.gridColumn = '1 / -1';
    // 注入一句话功能说明（命名优化层）：插到卡片标题正下方，仅注入一次
    if (meta.subtitle && !el.querySelector('.card-subtitle')) {
      var titleEl = el.querySelector('.card-title');
      if (titleEl) {
        var sub = document.createElement('div');
        sub.className = 'card-subtitle';
        sub.textContent = meta.subtitle;
        titleEl.insertAdjacentElement('afterend', sub);
      }
    }
    if (c.name === 'chat') hydrateChatState();
  });
}

function cardEl(cardName, selector) {
  var container = document.getElementById('card-' + cardName);
  return container ? container.querySelector(selector) : null;
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"]/g, function(ch) {
    return ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[ch];
  });
}

function hydrateChatState() {
  var input = cardEl('chat', '#chat-question');
  var answer = cardEl('chat', '#chat-answer');
  if (input) input.value = CHAT_STATE.question || '';
  if (answer) answer.innerHTML = CHAT_STATE.answerHtml || '等待提问...';
}

function setChatAnswerHtml(html) {
  CHAT_STATE.answerHtml = html;
  var answer = cardEl('chat', '#chat-answer');
  if (answer) answer.innerHTML = html;
}

function fillChatQuestion(question) {
  var input = cardEl('chat', '#chat-question');
  if (input && question) {
    input.value = question;
    CHAT_STATE.question = question;
  }
}

async function askChat() {
  var input = cardEl('chat', '#chat-question');
  if (!input) return;
  var question = input.value.trim();
  CHAT_STATE.question = question;
  if (!question) { setChatAnswerHtml('请先输入问题'); return; }
  CHAT_STATE.requestId += 1;
  CHAT_STATE.loading = true;
  var requestId = CHAT_STATE.requestId;
  setChatAnswerHtml('<div class="flex"><div class="spinner"></div><span class="text-secondary">正在检索历史观点...</span></div>');
  var result = await apiFetch('/cards/chat/action', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'ask', question: question, top_k: 5})
  });
  if (requestId !== CHAT_STATE.requestId) return;
  CHAT_STATE.loading = false;
  if (result && result.ok) {
    setChatAnswerHtml(escapeHtml(result.answer || '未生成回答'));
  } else {
    setChatAnswerHtml('问答失败: ' + escapeHtml((result && result.error) || '未知错误'));
  }
}

// ═══════════════════════════════════════════════════════════
// 自动刷新
// ═══════════════════════════════════════════════════════════
async function autoRefresh() {
  if (!_pageVisible) return;  // 后台标签页不刷新
  var active = document.querySelector('.tab-content.active');
  if (!active) return;
  var tabKey = active.id.replace('tab-', '');
  var cards = TAB_CARDS[tabKey] || [];
  var now = Date.now();
  for (var i = 0; i < cards.length; i++) {
    var name = cards[i].name;
    var interval = (REFRESH_MAP[name] || 0) * 1000;
    if (interval <= 0) continue;
    if (now - (LAST_FETCH[name] || 0) <= interval) continue;
    var result = await apiFetch('/cards/' + name);
    if (!result || result.error) continue;
    var newHtml = result.html;
    if (CACHE[name] && CACHE[name].html === newHtml) continue;
    CACHE[name] = { html: newHtml, data: result.data || {} };
    LAST_FETCH[name] = Date.now();
    var el = document.getElementById('card-' + name);
    if (el) {
      el.innerHTML = newHtml;
      _injectFreshness(el, name);
      el.classList.add('card-flash');
      setTimeout(function() { el.classList.remove('card-flash'); }, 600);
    }
    el && el.dispatchEvent(new CustomEvent('cardRefreshed', { bubbles: true }));
  }
  updateStatusBar();
}

// ═══════════════════════════════════════════════════════════
// 状态栏
// ═══════════════════════════════════════════════════════════
async function updateStatusBar() {
  var dResult = await apiFetch('/cards/daemon');
  var aResult = await apiFetch('/cards/api_status');
  if (!dResult || !aResult) return;
  var d = dResult.data, a = aResult.data;
  var running = d.running || false, rateLimited = a.rate_limited;

  var pulse = document.getElementById('sb_pulse');
  pulse.className = 'status-dot ' + (running ? 'on pulse' : 'off');
  pulse.style.background = rateLimited ? 'var(--warning)' : '';

  document.getElementById('sb_daemon').textContent = rateLimited ? '限流等待中...' : (running ? '自动采集运行中' : '自动采集已停止');
  document.getElementById('sidebar_status').textContent = rateLimited ? '限流中' : (running ? '运行中' : '已停止');
  document.getElementById('sb_today').textContent = running ? (a.total_fetched || '-') : '-';
  var total = 0; var counts = a.user_counts || {};
  Object.keys(counts).forEach(function(k) { total += counts[k]; });
  document.getElementById('sb_total').textContent = total || '-';
  document.getElementById('sb_updated').textContent = a.last_updated && a.last_updated !== '未开始' ? '更新于 ' + a.last_updated : '';
}

// ═══════════════════════════════════════════════════════════
// 侧边栏点击事件委托
// ═══════════════════════════════════════════════════════════
document.getElementById('sidebar_nav').addEventListener('click', function(e) {
  var item = e.target.closest('[data-tab]');
  if (!item) return;
  switchTab(item.getAttribute('data-tab'));
});

// ═══════════════════════════════════════════════════════════
// 全局事件委托 — data-action 驱动的交互路由
// ═══════════════════════════════════════════════════════════
// 提取共享分发逻辑，供 click 和 change 事件复用
function _dispatchAction(el) {
  var action = el.getAttribute('data-action');
  if (!action) return;
  var cardEl = el.closest('[data-card]');
  var cardName = cardEl ? cardEl.getAttribute('data-card') : '';

  switch (action) {
    case 'ask-chat': askChat(); break;
    case 'fill-chat-question': fillChatQuestion(el.getAttribute('data-question')); break;
    case 'toggle-daemon': toggleDaemon(); break;
    case 'test-telegram': sendTestMsg(); break;
    case 'save-telegram': saveTelegram(); break;
    case 'fetch-manual': fetchManually(); break;
    case 'gen-pick': generatePick(); break;
    case 'analyze-portfolio': analyzePortfolio(); break;
    case 'gen-portrait': genPortraitAdv(); break;
    case 'seed-tasks': seedTasksPE(); break;
    case 'run-clean': runCleanAlias(); break;
    case 'add-alias': addAlias(cardName); break;
    case 'toggle-scripts': toggleScriptTools(); break;
    case 'add-user': addTrackedUser(); break;
    case 'exec-pipeline': execPipeline(el.getAttribute('data-type')); break;
    case 'select-all-pe': selectAllPE(el.getAttribute('data-type')); break;
    case 'clear-all-pe': clearAllPE(el.getAttribute('data-type')); break;
    case 'retry-task': retryTaskPE(el.getAttribute('data-id')); break;
    case 'skip-task': skipTaskPE(el.getAttribute('data-id')); break;
    case 'load-type-pe': loadTypePE(el.getAttribute('data-type')); break;
    case 'select-window': selectWindow(el.getAttribute('data-label')); break;
    case 'edit-alias': editAliasRow(cardName, el.getAttribute('data-alias'), el.getAttribute('data-ticker'), el.getAttribute('data-notes')); break;
    case 'delete-alias': deleteAlias(cardName, el.getAttribute('data-alias')); break;
    case 'fill-alias': fillAliasForm(cardName, el.getAttribute('data-alias'), el.getAttribute('data-notes')); break;
    case 'skip-alias': skipAlias(cardName, el.getAttribute('data-alias')); break;
    case 'unskip-alias': unskipAlias(cardName, el.getAttribute('data-alias')); break;
    case 'toggle-portrait': togglePortrait(el.getAttribute('data-id')); break;
    case 'run-script': runScript(el.getAttribute('data-script')); break;
    case 'retry-card': retryCard(cardName); break;
    case 'acknowledge-governance-gap': acknowledgeGovernanceGap(el); break;
    case 'revoke-governance-gap': revokeGovernanceGap(el); break;
    case 'update-pool': updatePool(); break;
    case 'refresh-admin-users': refreshAdminUsers(); break;
    case 'toggle-user-active': toggleUserActive(el); break;
    case 'save-config-llm': saveConfigLLM(); break;
    case 'save-config-twitter': saveConfigTwitter(); break;
    case 'save-config-telegram': saveConfigTelegram(); break;
    case 'add-observation': addObservation(); break;
    case 'remove-observation': removeObservation(el); break;
    case 'switch-tw-provider': switchTwProvider(el.getAttribute('data-tw-provider')); break;
  }
}

document.addEventListener('click', function(e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  _dispatchAction(el);
});

document.addEventListener('change', function(e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  _dispatchAction(el);
});

async function refreshGovernanceCards() {
  var names = ['quality_gate', 'publish_review', 'risk_alerts', 'panel_review'];
  for (var i = 0; i < names.length; i++) {
    delete CACHE[names[i]];
    await retryCard(names[i]);
  }
}

async function acknowledgeGovernanceGap(btn) {
  var signalId = btn.getAttribute('data-signal-id');
  var gapCode = btn.getAttribute('data-gap-code');
  var card = btn.closest('[data-card]');
  var reasonEl = card ? card.querySelector('[data-gap-reason="' + gapCode + '"]') : null;
  var expiresEl = card ? card.querySelector('[data-gap-expires="' + gapCode + '"]') : null;
  var reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) { showToast('请简单说明为什么暂时接受这个风险'); return; }
  btn.disabled = true;
  var result = await apiFetch('/api/governance/gaps/acknowledge', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({signal_id: signalId, gap_code: gapCode, reason: reason, expires_in_hours: expiresEl ? expiresEl.value : 72})
  });
  btn.disabled = false;
  if (result && result.ok) { showToast('已保存，系统会重新检查这条信号'); await refreshGovernanceCards(); }
  else { showToast((result && result.error) || '操作没有保存成功'); }
}

async function revokeGovernanceGap(btn) {
  var signalId = btn.getAttribute('data-signal-id');
  var gapCode = btn.getAttribute('data-gap-code');
  btn.disabled = true;
  var result = await apiFetch('/api/governance/gaps/revoke', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({signal_id: signalId, gap_code: gapCode, reason: '用户决定不再接受这个风险'})
  });
  btn.disabled = false;

// Daemon 启停
// ═══════════════════════════════════════════════════════════
async function toggleDaemon() {
  var btn = document.getElementById('daemon-btn');
  if (!btn) return;
  btn.disabled = true;
  var before = await apiFetch('/cards/daemon');
  var wasRunning = before && before.data && before.data.running;
  await apiFetch('/cards/daemon/action', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'toggle'}) });
  for (var i = 0; i < 12; i++) {
    await new Promise(function(r) { setTimeout(r, 500); });
    var poll = await apiFetch('/cards/daemon');
    if (poll && poll.data && poll.data.running !== wasRunning) break;
  }
  var result = await apiFetch('/cards/daemon');
  if (result) { CACHE.daemon = { html: result.html, data: result.data || {} }; LAST_FETCH.daemon = Date.now(); var el = document.getElementById('card-daemon'); if (el) el.innerHTML = result.html; }
  updateStatusBar(); btn.disabled = false;
}

function sanitizeTrustedHtml(html) {
  var template = document.createElement('template');
  template.innerHTML = String(html || '');
  template.content.querySelectorAll('script, iframe, object, embed, link, meta').forEach(function(el) { el.remove(); });
  template.content.querySelectorAll('*').forEach(function(el) {
    Array.from(el.attributes).forEach(function(attr) {
      var name = attr.name.toLowerCase();
      var value = attr.value || '';
      if (name.indexOf('on') === 0 || value.toLowerCase().indexOf('javascript:') === 0) el.removeAttribute(attr.name);
    });
  });
  return template.innerHTML;
}
