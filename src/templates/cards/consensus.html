<div class="card-title">共识 TOP 5</div>
<table class="data">
<tr><th>股票</th><th style="text-align:right">得分</th><th style="text-align:right">信号</th></tr>
{% for r in top[:5] %}
<tr>
  <td style="font-weight:500">{{ r.ticker }}</td>
  <td style="text-align:right;font-weight:500;color:var(--text-success)">{{ '%d' % r.consensus_score }}</td>
  <td style="text-align:right;font-size:11px">{% if r.get('analysts_in_window', []) | length >= 2 %}🔥 {% endif %}{{ r.get('signal_count', 0) }}条</td>
</tr>
{% endfor %}
</table>
<div class="text-secondary mt-sm">{{ total }}只覆盖, {{ multi }}只双人</div>
