<div class="card-title">系统状态</div>

    ("画像", portraits ~ "份"),
    ("信号", signals ~ "条"),
    ("分析文件", analyzed ~ "个")
] %}

  <span class="text-secondary">{{ name }}</span><span>{{ value }}</span>
</div>
{% endfor %}
