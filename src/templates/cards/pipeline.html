<div class="card-title">推文分析</div>
{% if task_list %}
<div class="mb-sm">
  {% for type_name, count in stats.items() %}
  <span class="tag tag-ok">{{ type_name }}: {{ count }}</span>
  {% endfor %}
  <span class="text-secondary" style="font-size:11px">共 {{ total }} 个</span>
</div>
<table class="data"><tr><th>ID</th><th>类型</th><th>状态</th><th>时间</th></tr>
{% for t in task_list[:15] %}
<tr>
  <td><span style="font-weight:500">#{{ t.id }}</span></td>
  <td>{{ t.task_type }}</td>
  <td><span class="tag {% if t.status == "pending" %}tag-warn{% else %}tag-ok{% endif %}">{{ t.status }}</span></td>
  <td style="font-size:11px">{{ t.created_at }}</td>
</tr>
{% endfor %}
</table>
{% else %}
<div class="text-secondary">暂无待处理任务。</div>
{% endif %}
